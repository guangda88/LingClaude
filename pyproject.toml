[build-system]
requires = ["setuptools>=78.1.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lingclaude"
version = "0.6.0-lingyuan"
description = "灵克 (lingclaude) — 开源 AI 编程助手，内置自优化能力"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "tiktoken>=0.5.0",
    "aiohttp>=3.12.14",
    "pyyaml>=6.0",
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
]
optimization = [
    "optuna>=3.3.0",
]

[project.scripts]
lingclaude = "lingclaude.cli.__main__:main"
lingclaude-mcp = "lingclaude.mcp.server:main"
lingclaude-mcp-proxy = "lingclaude.mcp.http_proxy:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lingclaude*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    # T3 handler 解耦迁移期：存量测试直传 ToolDefinition(handler=...) 的
    # DeprecationWarning 在此静默（新代码一律 register_handler + handler_name）
    "ignore:ToolDefinition.*已废弃.*:DeprecationWarning",
]

[tool.mypy]
python_version = "3.10"
strict = true
