[build-system]
requires = ["setuptools>=78.1.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lingclaude"
version = "0.6.0-lingyuan"
description = "灵克 (lingclaude) — 开源 AI 编程助手，内置自优化能力"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "tiktoken>=0.5.0",
    "aiohttp>=3.12.14",
    "pyyaml>=6.0",
    "mcp>=1.0",
    # 2026-09-26 依赖补账（D8，16a）：以下为主包实测 import 面。版本下限
    # = 当前验证组合实测版本（本机 pip show），未做旧版兼容性验证，故取
    # 「至少本组合可跑」口径；宽松化需先降版实测。
    # — 顶层导入（缺失即 ImportError）：
    "fastapi>=0.128",      # lingclaude/api.py 顶层
    "pydantic>=2.12",      # lingclaude/api.py 顶层（fastapi 连带）
    "httpx>=0.28",         # model/llm_proxy/proxy.py + provider_pool.py 顶层
    # — CLI 必备面（repl/interface/full_tui，CLI 主路径函数内导入）：
    "prompt_toolkit>=3.0",
    "rich>=14.3",          # cli/display.py（lazy）
    # — 服务启动面（api.py / mcp/http_proxy.py lazy，起服务时需要）：
    "uvicorn>=0.40",
    "starlette>=0.52",     # mcp/http_proxy.py lazy（fastapi 连带但显式声明）
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "pytest-xdist",        # full-pytest pre-push 门禁 -n $(nproc) 使用
]
optimization = [
    "optuna>=3.3.0",
]
# ——— 以下为主包 lazy 导入的可选功能面（2026-09-26 清查，缺包时功能降级不崩）———
voice = [
    "openai-whisper>=20250625",  # engine/stt.py（实测 20250625）
    "sherpa-onnx",               # engine/stt.py alt backend；本机未装，版本未验证
]
local-model = [
    "torch>=2.5",          # model/fast_lane.py + local_provider.py（lazy）
    "transformers>=5.13",  # model/local_provider.py（lazy）
]
db = [
    "asyncpg>=0.31",       # core/state_store.py + fact_checker.py（lazy PG 后端）
]
browser = [
    "playwright>=1.58",    # plugins/agents/cap_browser（lazy）
]
# ——— 跨成员依赖（sibling 仓库，非 pip 包，不进 dependencies）———
# 主包 import 面实测（2026-09-26，AST 全扫 lingclaude/）：
#   lingmessage ×9 语句/8 文件（api/coordination/core/wakeup_channel/governance/mcp）
#   lingyuan    ×7 语句/4 文件
#   lingminopt  ×3 语句/2 文件
#   lingflow    ×1 语句/1 文件
#   lingmemory  ×1 语句/1 文件
# 这些经宿主环境（sys.path 基线受 G2 守卫管辖）装载，装包口径见灵字辈各仓。

[project.scripts]
lingclaude = "lingclaude.cli.__main__:main"
lingclaude-mcp = "lingclaude.mcp.server:main"
lingclaude-mcp-proxy = "lingclaude.mcp.http_proxy:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lingclaude*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    # xdist-state-write-race 债（2026-09-18 立）：no_xdist 此前只有裸声明
    # 无注册无执行机制，"单线程执行"保护不存在。现注册并由 conftest 的
    # pytest_collection_modifyitems 落地为 xdist_group("no_xdist_serial")，
    # xdist 下按 loadgroup 绑组串行；未装 xdist 时单进程本就串行，无操作。
    "no_xdist: 本测试需单进程串行执行（xdist 下自动绑入专属 loadgroup）",
]
filterwarnings = [
    # T3 handler 解耦迁移期：存量测试直传 ToolDefinition(handler=...) 的
    # DeprecationWarning 在此静默（新代码一律 register_handler + handler_name）
    "ignore:ToolDefinition.*已废弃.*:DeprecationWarning",
]

# ---------------------------------------------------------------------------
# ruff ratchet（P0-A 阶段 0，2026-09-21，见 docs/CORE_SURFACE_CONTRACT.md §三）
#
# 原则：T20(print) 全局启用拦截**新增** print；存量只允许豁免清单**缩小**，
# 不允许扩大。每清零一个文件，把对应行从 per-file-ignores 删除。
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
# 契约 §三 的管辖范围 = 主包（lingclaude/）+ tests；
# scripts/workspace/benchmarks/沙箱目录是一次性脚本与实验区，不在 ratchet 管辖内
include = ["lingclaude/**/*.py", "tests/**/*.py"]
exclude = ["**/__pycache__", "**/*.bak"]

[tool.ruff.lint]
select = ["T20"]  # 只拦 print/printf；其余规则族按需逐个启用

[tool.ruff.lint.per-file-ignores]
# —— 存量豁免（ratchet 底座，只减不增）——
# core 层 5 文件 59 处：调试/守护进程诊断输出，P0-A 迁移期逐步清零
"lingclaude/core/context_cache.py" = ["T201"]
"lingclaude/core/task_scheduler.py" = ["T201"]
"lingclaude/core/lm_quick.py" = ["T201"]
"lingclaude/core/manifest_lock.py" = ["T201"]
"lingclaude/core/llm_probe.py" = ["T201"]
# model/router 25 处：路由决策诊断
"lingclaude/model/intelligent_router.py" = ["T201"]
# engine 层零散 8 处：网关/插件诊断
"lingclaude/engine/plugin_runner.py" = ["T201"]
"lingclaude/engine/coding_wiring.py" = ["T201"]
"lingclaude/engine/coding.py" = ["T201"]
"lingclaude/engine/sensitive_path_gate.py" = ["T201"]
# landlock helper：独立进程脚本，stderr 告警是 fail-open 的显式接口（非主干代码）
"lingclaude/engine/_landlock_helper.py" = ["T201"]
# lacp 17 处：市场/沙箱策略 CLI 面向输出
"lingclaude/lacp/marketplace.py" = ["T201"]
"lingclaude/lacp/sandbox_policy.py" = ["T201"]
# 自优化守护/协调/MCP 代理/webui 接缝：进程级诊断
"lingclaude/self_optimizer/daemon.py" = ["T201"]
"lingclaude/coordination/message_signer.py" = ["T201"]
"lingclaude/mcp/http_proxy.py" = ["T201"]
"lingclaude/webui_seam.py" = ["T201"]
# CLI/TUI 层：print 是合法输出通道（契约 §三 明确豁免层），一次性全免
"lingclaude/cli/*" = ["T201"]
# —— tests 存量豁免 9 文件 41 处（ratchet：只减不增；新测试文件不享受豁免）——
"tests/hallucination_bench.py" = ["T201"]
"tests/test_cleanup_sandbox.py" = ["T201"]
"tests/test_d8_mv1b.py" = ["T201"]
"tests/test_engine_l5_adapter_demo.py" = ["T201"]
"tests/test_full_tui.py" = ["T201"]
"tests/test_message_builder.py" = ["T201"]
"tests/test_process_guard.py" = ["T201"]
"tests/test_tool_pipeline.py" = ["T201"]
"tests/test_tools_v2.py" = ["T201"]

[tool.mypy]
python_version = "3.10"
strict = true
