# linggit-bot 审查规则 — 灵克代码审计用
# 规则类型: pattern (正则匹配diff内容) / filename (文件名匹配) / command (外部命令)

checks:
  # === 安全规则 (critical/high) ===
  - type: pattern
    pattern: 'eval\('
    severity: critical
    description: "eval() 使用 — 代码注入风险"
    fix: "替换为 ast.literal_eval() 或 json.loads()"

  - type: pattern
    pattern: 'shell\s*=\s*True'
    severity: high
    description: "subprocess shell=True — 命令注入风险"
    fix: "使用 shell=False + 参数列表"

  - type: pattern
    pattern: 'os\.system\('
    severity: high
    description: "os.system() — 命令注入风险"
    fix: "使用 subprocess.run() + shell=False"

  - type: pattern
    pattern: 'except\s*:'
    severity: high
    description: "裸 except — 吞异常"
    fix: "使用 except Exception as e: 并记录"

  - type: pattern
    pattern: 'except.*:\s*pass'
    severity: high
    description: "silent except — 异常被静默吞掉"
    fix: "至少 log.warning(str(e))"

  - type: pattern
    pattern: '(password|secret|token|api_key)\s*=\s*[''"][^''"$<]{12,}[''"]'
    severity: critical
    description: "硬编码密钥 (已排除测试桩/占位符/环境变量引用)"
    fix: "使用环境变量或配置文件"

  - type: pattern
    pattern: 'pickle\.loads?\('
    severity: critical
    description: "pickle 反序列化 — 远程代码执行风险"
    fix: "使用 json.loads() 或限制 unpickler"

  - type: pattern
    pattern: 'subprocess\.call\([^)]*shell\s*=\s*True'
    severity: high
    description: "subprocess.call + shell=True"
    fix: "使用 subprocess.run() + shell=False"

  # === Rust 规则插片 (2026-08-02 灵克补) ===
  - type: pattern
    pattern: 'Command::new\(\s*["''](sh|bash|/bin/(sh|bash))["'']\s*\)'
    severity: high
    description: "Rust 直接执行 shell — 命令注入风险"
    fix: "改用 Command::new(程序).arg(参数列表)，或对命令字符串做白名单校验"

  - type: pattern
    pattern: '(std::)?env::var\s*\([^)]*\)\s*\.(unwrap|expect)\s*\('
    severity: high
    description: "Rust 环境变量读取后直接 unwrap — 缺配置即 panic"
    fix: "改用 .unwrap_or_default() / match / 显式错误处理"

  - type: pattern
    pattern: 'unsafe\s*\{'
    severity: medium
    description: "Rust unsafe 块 — 需人工审查"
    fix: "补 // SAFETY 注释，最小化 unsafe 范围"

  - type: pattern
    pattern: '\.join\(\s*["''][^"'']*\.\.[^"'']*["'']\s*\)'
    severity: medium
    description: "Rust 路径 join 含 .. — 路径穿越风险"
    fix: "canonicalize 后校验前缀，拒绝 .. 组件"

  - type: pattern
    pattern: '(from_utf8_unchecked|transmute)'
    severity: high
    description: "Rust 未检查 UTF-8 转换 / 类型强转 — UB 风险"
    fix: "改用 from_utf8_lossy / TryFrom 安全转换"

  # === 灵族特有规则 (medium) ===
  - type: filename
    pattern: 'CRUSH\.md'
    severity: medium
    description: "修改身份锚定文件 — 需审查是否为身份漂移"
    fix: "确认修改经过授权"

  - type: filename
    pattern: 'handover\.ya?ml'
    severity: medium
    description: "修改交接文件 — 需确认状态变更"
    fix: "确认 handover 铁律: 读后必验 读完必写"

  - type: filename
    pattern: '\.env'
    severity: high
    description: "触及 .env 文件 — 密钥泄露风险"
    fix: "确认 .env 在 .gitignore 中"

  - type: filename
    pattern: 'config\.json'
    severity: medium
    description: "修改配置文件 — 可能含 API keys"
    fix: "确认不含硬编码密钥"

  - type: filename
    pattern: 'members\.ya?ml'
    severity: high
    description: "修改成员表 — 身份注入风险"
    fix: "确认经过治理流程"

  # === 代码质量规则 (low) ===
  - type: pattern
    pattern: 'import.*#\s*unused'
    severity: low
    description: "可能的 unused import"
    fix: "移除未使用的导入"

  - type: pattern
    pattern: 'TODO|FIXME|HACK'
    severity: low
    description: "未完成标记"
    fix: "跟踪为 issue"
