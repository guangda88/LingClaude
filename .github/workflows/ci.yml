# D1 (灵元1.0 P1): 最小 CI — 离线三层, 全部本地演练过才上
# 设计原则: hermetic 优先。全量 pytest 有网络依赖(真实治理状态目录/LLM端点),
# 故第一版不跑全量, 只跑: ①全量编译 ②ruff 真bug类(F821/F811) ③导入冒烟
# ④tests/unit 定向单测(continue-on-error 观察1-2周再决定是否转必过)。
# 本地演练命令(2026-09-10 全绿):
#   python3 -m compileall lingclaude -q
#   ruff check lingclaude --select F821,F811
#   python3 -c "import lingclaude.engine.coding, lingclaude.core.config"
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  compile:
    name: 全量编译
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: compileall
        run: python -m compileall lingclaude -q

  lint:
    name: ruff 真 bug 类检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pipx install ruff
      - name: F821 undefined / F811 redefined
        run: ruff check lingclaude --select F821,F811

  smoke:
    name: 导入冒烟
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Smoke import (无三方依赖模块)
        run: |
          python -c "import lingclaude; print('lingclaude OK')"

  unit:
    name: 定向单测 (观察期)
    runs-on: ubuntu-latest
    continue-on-error: true # 观察期: hermetic 边界未完全确认, 先看红绿再转必过
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: pytest tests/unit
        run: python -m pytest tests/unit -q -p no:cacheprovider

  selftest:
    name: 插件自测门禁 (E7 质量门)
    runs-on: ubuntu-latest
    # 2026-09-16: 插件自测已从启动路径移出（run_tests=False 启动提速），
    # 质量门禁改由 lingclaude selftest 独立执行——CI 在此兜底，防插件
    # 带病入库（灵元「插片无测试=非法插片」E7 的执行点）。
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: lingclaude selftest
        run: python -m lingclaude.cli.app selftest

  arch-guards:
    name: 铁律守卫 (M1-M5 + 债务到期, J5)
    runs-on: ubuntu-latest
    # 2026-09-17 铁律返审：守卫存在但 CI 不可达 = 守卫真空（J5 失守）。
    # 守卫测试纯离线（AST 扫描 + StateStore json + SeamRegistry，无网络
    # 依赖），不属 unit job 的 hermetic 顾虑范围，故独立成必过 job。
    # 台账豁免/债务随仓库 data/arch_ledger/ 一起 checkout，守卫即查询。
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: pytest iron law guards
        run: python -m pytest tests/test_iron_law_guards.py -q -p no:cacheprovider
      # 2026-09-23 第三批整改（audit P3）：M4 套件级换域升格——
      # test_m4_suite_level_domain_swap 子进程跑 tests/fixtures/m4_synthetic_suite.py
      # （合成域 order/ticket，M4_DOMAIN_ROOT 注入），随 iron law guards 同步生效。
      # 2026-09-23 第二批整改（docs/audit/20260923_total_report.md §7.2 P0 #1/#4/#5）：
      # 三件守卫此前均不在任何 CI 路径（守卫真空）——
      #  N5 契约漂移：contract_drift check，漂移/未对账即红（record 首记已在册）；
      #  N1 互账对账：federation_pair 双 record + 指纹器（N1 绑 N5 共享 hash）；
      #  M6 双口径：seam_trend_inspect 跑通并出新快照（arch_m6_seam_snapshot 独立
      #    命名空间）+ 运行时 SeamRegistry 实拍。仪表不设红线，仅内部错误非零。
      - name: N5 contract drift check
        run: |
          python scripts/contract_drift.py check agent:agent_lingxi
          python scripts/contract_drift.py check agent:lc_mcp_guard
      - name: N1 federation pair audit
        run: python scripts/n1_federation_audit.py --json
      - name: M6 seam trend snapshot (dual-caliber)
        run: python scripts/seam_trend_inspect.py --json > /dev/null
      # 2026-09-17 整改（audit-lingke-report-verified P0-1）：旧 G 守卫此前
      # 不在任何 CI 路径（守卫真空复发），G10 红灯本地挂无人知。纳入本
      # 必过 job：G1-G10b 含守卫债务感知（豁免必须挂账）。
      - name: pytest legacy G guards
        run: python -m pytest tests/test_p04_arch_guards.py -q -p no:cacheprovider
      # 2026-09-17 Phase 1 试验田：agent 插片测试（N2/N3/J4/缺席语义守卫）
      # 纯离线（hermetic，不依赖真实 lingxi 进程），随 arch-guards 必过。
      - name: pytest agent plugins
        run: python -m pytest tests/agents/ -q -p no:cacheprovider

  hallucination-gate:
    name: 幻觉治理门禁 (P2-5c, 2026-09-19 调研固化)
    runs-on: ubuntu-latest
    # 调研三批的 CI 固化层：固定事实题集 × 治理管线断言（凭空完成声明
    # 探测、cross-reference 放行、flash 门禁语义、实测化评分公式、
    # NOT_FOUND/外部知识纪律在常驻提示词）。纯离线（regex + 纯函数，
    # 无网络无 LLM），与 tests/hallucination_bench.py Layer 1 同源。
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: hallucination bench (Layer 1)
        run: python tests/hallucination_bench.py
      - name: pytest P1/P2 落地测试
        run: python -m pytest tests/test_hallucination_p1p2.py -q -p no:cacheprovider
