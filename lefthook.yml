# LingClaude lefthook config — hooks 由 lefthook install 管理
# lefthook 路径: /home/ai/deepseek-harness/node_modules/.pnpm/lefthook-linux-x64@2.1.9/node_modules/lefthook-linux-x64/bin/lefthook
# 灵督规则: linggit/rules/review_rules.yaml (20 checks)

pre-commit:
  commands:
    linggit-audit:
      run: python3 linggit/hooks/pre_commit.py --rules-dir linggit/rules
      stage_fixed: false
    # 2026-09-12: 生成审计记录，供 post-commit 校验（tree_hash + 签名）。
    # 之前 audit_record 未接入 lefthook，导致 post-commit 找不到记录而撤销提交。
    # 必须在暂存区冻结时生成（git write-tree 与 HEAD^{tree} 一致）。
    audit-record:
      run: python3 scripts/audit_record.py --json-out .audit/pre_commit_audit.json
      stage_fixed: false
    # R6（工作区并发纪律）：提交前留工作区快照基线，下一次 check 才能检测
    # 「HEAD 未动而工作区被并发扫动」。advisory：命令恒 exit 0，不阻断。
    # 注：不接 post-commit —— .git/hooks/post-commit 已被灵字辈钩子 v3.0
    # （提交后审计签名验证）占用，且其源不在本仓库，lefthook 接管会覆盖它。
    workspace-snapshot:
      run: python3 scripts/prechange_snapshot.py record --label "pre-commit"

pre-push:
  commands:
    pre-push-security:
      run: bash .git/hooks/pre-push-security
      priority: 10
    # T2（opencode 架构演进期补充闸）：豁免提交（LING_AUDIT_FAST）的后台全量
    # 复核 FAIL 未消化时拒绝 push。full-pytest 只验当前工作区，挡不住历史豁免
    # 提交带病上远程。旁路：LINGCLAUDE_SKIP_REVIEW_GATE=1（显式留痕）。
    exempt-review-gate:
      run: python3 scripts/exempt_review_gate.py
      priority: 15
    # 2026-09-10 测试分层（第3步）: 全量 pytest 移到 pre-push 门禁（无 exclude）。
    # pre-commit 只跑快子集（.audit/exclude_tests.txt 排除慢测试），全量兜底在此。
    full-pytest:
      run: python3 -m pytest tests/ --tb=line -q -n $(nproc)
      priority: 20
