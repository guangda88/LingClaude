fast_lane_questions:
  $ref: router_questions
fast_lane_enabled: true
fan_out_questions:
  difficulty:
    type: score
    instructions: How hard is `request` for a language model?
    criteria:
    - 'trivial: a lookup or one-liner'
    - 'easy: short answer, no reasoning'
    - 'moderate: several steps'
    - 'hard: long multi-step reasoning or specialist knowledge'
  domain:
    type: choice
    instructions: What domain does `request` belong to?
    criteria:
      code: software engineering, programming, refactoring, architecture, debugging
      math_or_logic: mathematics, logic puzzles, proofs, complex calculation
      writing: creative writing, essays, emails, blog posts, copywriting
      factual_lookup: facts, definitions, trivia, history
      data_analysis: statistics, SQL, data manipulation, metrics
      other: none of the above fits
defaults:
  fan_out_tags:
  - difficulty
  - domain
  branch_prompt_template: 就 {state} 回答子目标「{question_tag}」
  fan_out_reuse_threshold: 0.8
  fast_lane_min_confidence: 0.1
  fast_lane_weak_domains:
  - factual_lookup
  fan_out_speculative_min_difficulty: 0.5
  spec_decision_enabled: true
  spec_decision_value_threshold: 0.5
  spec_decision_score_threshold: 0.6
  claim_gate_threshold: 0.5
  bounded_compaction_enabled: true
