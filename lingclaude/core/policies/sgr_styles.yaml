# SGR 样式白名单策略（灵元 R2：策略是 data，不是结构）
# 来源：lingclaude/cli/interface.py:_sgr_params_to_style 硬编码外置
# 原则：改 SGR 收录范围只改此文件，不动代码（mtime watch 热更，不重启进程）。
# 加载优先级（对位 model_policy.yaml）：
#   1. 调用方显式传入（测试用）
#   2. 本 YAML（策略文件）
#   3. 代码内 _FALLBACK_SGR_POLICY（最终兜底，与 YAML 保持同步）

# 修饰符：SGR 码 → PT 样式名。enable=开启的码，disable=对应清除码。
modifiers:
  bold:      {enable: [1, 2], disable: 22}
  italic:    {enable: [3],    disable: 23}
  underline: {enable: [4],    disable: 24}
  strike:    {enable: [9],    disable: 29}
  reverse:   {enable: [7],    disable: 27}

# 颜色：基础 8 色前景/背景码区间 + 默认色码。
colors:
  fg_normal_lo: 30      # 30-37 普通前景
  fg_normal_hi: 37
  fg_bright_lo: 90      # 90-97 高亮前景
  fg_bright_hi: 97
  bg_normal_lo: 40      # 40-47 普通背景
  bg_normal_hi: 47
  bg_bright_lo: 100     # 100-107 高亮背景
  bg_bright_hi: 107
  default_fg: 39        # 默认前景（清除 fg）
  default_bg: 49        # 默认背景（清除 bg）

# 扩展色（38;5;n / 38;2;r;g;b）：reject = 跳过不产生样式（现行为）
extended: reject

# 防御：单条 SGR 序列最大参数个数（超过整条拒绝）
max_params: 32

# 全清码（SGR 0 / 空串等价）
reset_code: 0
