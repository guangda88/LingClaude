# 2026-10-01：外部 Agent 联审结论（cc/codex/crush/opencode 四家独立提出）
# 核心原则：裁决点钉在可观测、可记账的单次工具调用上，安全从软约束变硬约束
#
# 四档语义：
#   auto       — 执行前无需用户确认（read-only 类，风险极低）
#   pre_approve— 执行前需用户显式批准（可逆写，高风险写）
#   ask        — 执行前询问用户意图（外部发送，数据出境）
#   block      — 拒绝执行，交还用户决策（破坏性操作）
#
# 裁决结果连同策略 ID 入台账，审计从"记动作"升级为"记裁决链"

# ── 工具档位矩阵（工具名正则或精确匹配）─────────────────────────
# 正则用 re.fullmatch，精确用字符串字面量
# 正则写法示例："edit_file|write_file" → 命中多个工具

tiers:
  # ── 档位 A：只读，自动放行 ──────────────────────────────────────
  auto:
    description: "只读类工具，执行前无需确认"
    tools:
      - "Read"
      - "read"
      - "read_file"
      - "grep"
      - "glob"
      - "lsp"
      - "bash_lingxi"          # 内部 MCP，只读读态
      - "ask_question"         # 知识查询
      - "domain_query"         # 知识查询
      - "safe_db_query"        # 只读查询
      - "git_log"
      - "git_status"
      - "git_blame"
      - "git_diff"

  # ── 档位 P：可逆写，需预审 ──────────────────────────────────────
  pre_approve:
    description: "可逆写操作，执行前需用户预批准"
    tools:
      - "edit_file"
      - "write_file"
      - "edit"
      - "write"
      - "file_insert"
      - "file_delete_lines"
      - "file_undo"
      - "ast_replace"
      - "edit_code"
      - "write_file"
      - "replace_function"
      - "apply_LINE_EDIT"      # 可能的内部工具名

  # ── 档位 Q：外部发送，询问 ──────────────────────────────────────
  ask:
    description: "外部发送/网络操作，执行前询问用户意图"
    tools:
      - "bash"                 # 默认 ask；command_patterns 命中时覆盖
      - "bash_lingxi"          # 已列 read-only，但 bash 可构造恶意命令
      - "execute_command"
      - "run_bash"
      - "subprocess"           # 潜在危险 Python 调用
      - "submit_feedback"
      - "submit_search_feedback"

  # ── 档位 X：破坏性操作，直接拒绝 ───────────────────────────────
  block:
    description: "破坏性操作，直接拒绝执行，交还用户"
    tools:
      - "delete_file"
      - "rm"
      - "drop_table"
      - "truncate"
      - "systemctl"            # 默认 block；command_patterns 命中时覆盖
      - "kill_process"
      - "os.system"            # 潜在危险 Python 调用

# ── 预审确认超时（秒）──────────────────────────────────────────
# 超时后视为拒绝，防止用户无响应时永久阻塞
pre_approve_timeout: 120

# ── 凭证泄漏守卫（atomcode hooks.json block-credential-leak 同款）────────
# P1a（2026-10-01）：外部 Agent 联审结论（cc/codex/crush/opencode 四家）——自托管
# agent 最常见事故=日志/上下文泄漏密钥，正则守卫堵在此层。
# block_patterns：用 re.search 匹配，命中即 block（即使 tier=auto）。
# 匹配对象=工具参数字符串（完整 args JSON string）。
credential_leak_guard:
  enabled: true
  block_patterns:
    # OpenAI / Anthropic / OpenRouter
    - "sk-[A-Za-z0-9_-]{20,}"
    - "sk-ant-[A-Za-z0-9_-]{20,}"
    # Bearer token
    - "(?i)bearer\\s+[A-Za-z0-9_-]+"
    # AWS
    - "AKIA[A-Z0-9]{16}"
    - "(?i)aws_access_key\\s*[=:]\\s*[A-Za-z0-9/+=]+"
    - "(?i)aws_secret\\s*[=:]\\s*[A-Za-z0-9/+=]+"
    # Google Cloud
    - "(?i)AIza[A-Za-z0-9_-]{35,}"
    - "(?i)google.*api[_-]?key\\s*[=:]\\s*[A-Za-z0-9_-]+"
    # Generic secret patterns
    - "(?i)(api[_-]?key|secret[_-]?key|access[_-]?token|auth[_-]?token)\\s*[=:]\\s*['\"]?[A-Za-z0-9_-]{16,}['\"]?"
    # 云厂商 SDK token（JSON args 里是 "minimax_api_key": "xxx"，正则匹配 key 名）
    - "sk-[A-Za-z0-9_-]{32,}"
    - "(?i)minimax[_-]?api[_-]?key[\"']?\\s*[=:]"
    - "(?i)zhipu[_-]?api[_-]?key[\"']?\\s*[=:]"
    - "(?i)deepseek[_-]?api[_-]?key[\"']?\\s*[=:]"
    - "(?i)kimi[_-]?api[_-]?key[\"']?\\s*[=:]"
    - "(?i)volc[_-]?(coding|engine)?[_-]?api[_-]?key[\"']?\\s*[=:]"

# ── 命令模式档位（针对 bash/execute_command/run_bash 等可构造任意命令的工具）
# 2026-10-11：有限度放权——只读 systemctl/journalctl 等运维查询自动放行，
# 服务启停、模型拉起等可逆写操作需预审，sudo/跨网络/高危破坏仍拦截。
# 匹配顺序：block → ask → pre_approve → auto（先命中严规则）；
# 命令模式未命中时回退到上方 tiers 工具名矩阵。
command_patterns:
  # 高危直接 block
  block:
    - "^systemctl\\s+--system\\b"
    - "^systemctl\\s+(poweroff|reboot|halt|suspend|hibernate)\\b"
    - "^rm\\s+-rf\\s+/($|\\s)"
    - "^rm\\s+-rf\\s+/home/ai/\\.[^/]+"
    - "^mkfs\\."
    - "^dd\\s+"
    - ":\\(\\)\\{ :|:& \\};:"

  # 仍需要询问（systemctl/kill 用否定前瞻，避免覆盖 auto/pre_approve 的更具体规则）
  ask:
    - "^systemctl\\s+(?!(--user|--system)\\b)"
    - "^sudo\\b"
    - "^su\\b"
    - "^mount\\b(?!\\s+-o\\s+remount,)"
    - "^umount\\b"
    - "^curl\\b.*\\b(http|https)://"
    - "^wget\\b"
    - "^ssh\\b"
    - "^scp\\b"
    - "^nc\\b"
    - "^nmap\\b"
    - "^iptables\\b"
    - "^ufw\\b"
    - "^killall\\b"
    - "^pkill\\b(?!\\s+-f\\s+llama-server)"
    - "^kill\\s+(?!-TERM\\s+\\d+)"
    - "^rm\\s+-rf\\b"
    - "^chmod\\s+.*777"
    - "^chown\\s+-R\\b"

  # 可逆写操作，需预审
  pre_approve:
    - "^systemctl\\s+--user\\s+(start|stop|restart|reload|enable|disable|reenable)\\b"
    - "^systemctl\\s+--user\\s+daemon-reload\\b"
    - "^systemctl\\s+--user\\s+reset-failed\\b"
    - "^mount\\s+-o\\s+remount,"
    - "^kill\\s+-TERM\\s+\\d+"
    - "^pkill\\s+-f\\s+llama-server$"
    - "^llama-server\\s+.*--port\\s+\\d+"
    - "^git\\s+push\\b"
    - "^git\\s+reset\\b"
    - "^git\\s+clean\\b"

  # 只读 / 低风险，自动放行
  auto:
    - "^systemctl\\s+--user\\s+(status|list-units|is-active|is-enabled|show)\\b"
    - "^journalctl\\s+--user\\s+-u\\s+.+\\s+-n\\s+\\d+\\s+--no-pager$"
    - "^ps(\\s+aux|\\s+-ef|\\s+ax)?$"
    - "^ss\\s+-tlnp$"
    - "^ls(\\s+|$)"
    - "^git\\s+(status|log|diff|blame|show|branch)\\b"
    - "^grep\\b"
    - "^cat\\b"
    - "^head\\b"
    - "^tail\\b"
    - "^echo\\b"
    - "^pwd$"
    - "^whoami$"
    - "^hostname$"
    - "^date$"
    - "^which\\b"
    - "^type\\b"
    - "^df\\s+-h$"
    - "^free\\s+-h$"
    - "^uptime$"
    - "^uname\\b"
    - "^id$"

# ── 审计开关───────────────────────────────────────────────────
audit_enabled: true
