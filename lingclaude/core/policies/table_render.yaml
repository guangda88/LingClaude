# table_render.yaml —— TUI 正文 Markdown 表格渲染策略（热更 data，不改 module）
#
# 2026-09-29 灵元 R2 路线1：repl_io 表格对齐规则从硬编码外置到策略数据。
# 改本文件无需重启进程，PolicyLoader mtime watch（默认 30s 节流）自动生效；
# 文件缺失/解析失败时 repl_io 回退内置默认（graceful degrade，见 _FALLBACK）。
#
# 说明：外置的是【规则数据】，不是算法。"切列→取每列显示宽最大→补半角空格"
# 的重排逻辑留在 repl_io.py 的 Python 里，永不外置（reload data 不 reload module）。

# 是否启用表格对齐重排。false = 表格行与普通行一样即时流式直出（恢复原样，
# 竖线可能错位但零延迟）。true = 暂存表块、块结束统一按显示列对齐后输出。
enabled: true

# 补齐用的填充字符。必须半角（显示宽=1），否则对齐算法失效。
# 不要用全角空格（＼u3000）——全角=2 列会让 pad 计算错位。
pad_char: " "

# 单元格补白后的最小显示列宽（0 = 不限）。防极窄表（如 |a|b|）被压成 1 列宽。
min_col_width: 0

# 表格行判定：行 strip 后以该前缀开头、该后缀结尾才算表行（默认 Markdown `|` 表）。
# 改了前后缀，重排输出仍统一用 "| " 风格拼接（输出风格不随输入风格变化）。
row_prefix: "|"
row_suffix: "|"

# 表块暂存行数上限。病态流（几千行连续 | 行）防内存膨胀：超限时直接按
# 当前累积块 flush 一次并开始新块（对齐只在块内成立，跨块可能错位，但不丢行）。
max_block_rows: 200
